<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Pomodoro</title>
<style>
/* ============================================================
   DESIGN SYSTEM – LIGHT (default) & DARK THEMES
   ============================================================ */
:root{
  --bg:#ffffff;
  --bg2:#f7f7f7;
  --card:#ffffff;
  --elev:#f2f2f2;
  --border:#e6e6e6;
  --text:#111111;
  --text2:#555555;
  --muted:#8a8a8a;
  --focus:#d97706;
  --short:#059669;
  --long:#2563eb;
  --danger:#dc2626;
  --success:#16a34a;
  --accent:var(--focus);
  --overlay-bg:rgba(0,0,0,.42);
  --ring-track:#ededed;
  --bar-zero:#ececec;
  --switch-bg:#d4d4d4;
  --switch-thumb:#8a8a8a;
  --input-bg:#f7f7f7;
  --shadow:0 4px 18px -8px var(--accent);
  --r-sm:8px;
  --r:12px;
  --r-lg:16px;
  --ring-size:min(72vw, 38vh, 300px);
}
[data-theme="dark"]{
  --bg:#000000;
  --bg2:#080808;
  --card:#101010;
  --elev:#181818;
  --border:#232323;
  --text:#ffffff;
  --text2:#929292;
  --muted:#666666;
  --focus:#f59e0b;
  --short:#34d399;
  --long:#60a5fa;
  --danger:#ef4444;
  --success:#22c55e;
  --accent:var(--focus);
  --overlay-bg:rgba(0,0,0,.82);
  --ring-track:#1a1a1a;
  --bar-zero:#1c1c1c;
  --switch-bg:#2a2a2a;
  --switch-thumb:#8a8a8a;
  --input-bg:#0d0d0d;
  --shadow:0 4px 20px -8px var(--accent);
}
body[data-mode="focus"]{ --accent:var(--focus); }
body[data-mode="short"]{ --accent:var(--short); }
body[data-mode="long"]{ --accent:var(--long); }

*{ box-sizing:border-box; margin:0; padding:0; }

html, body{
  height:100%;
  overflow:hidden;
  overscroll-behavior:none;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size:15px;
  line-height:1.5;
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  transition:background .25s, color .25s;
}

button, input, select, textarea{ font-family:inherit; font-size:inherit; color:inherit; max-width:100%; }
button{ cursor:pointer; }
svg{ display:block; }

::selection{ background:rgba(217,119,6,.25); }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

/* ============================================================
   APP SHELL
   ============================================================ */
.app{
  height:100vh;
  height:100dvh;
  max-width:1180px;
  margin:0 auto;
  padding:0 clamp(12px, 3vw, 24px);
  display:flex;
  flex-direction:column;
  min-height:0;
}

/* ---------- Top bar ---------- */
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  height:58px;
  flex:none;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:600;
  font-size:16px;
  letter-spacing:.2px;
  white-space:nowrap;
  min-width:0;
}
.brand .logo{ width:22px; height:22px; color:var(--accent); transition:color .3s; flex:none; }
.topbar-actions{ display:flex; gap:2px; align-items:center; flex:none; }

.icon-btn{
  width:36px; height:36px;
  display:grid; place-items:center;
  background:transparent;
  border:1px solid transparent;
  border-radius:9px;
  color:var(--text2);
  transition:background .18s, color .18s;
  flex:none;
}
.icon-btn svg{ width:17px; height:17px; }
.icon-btn:hover{ background:var(--elev); color:var(--text); }
.icon-btn:active{ transform:scale(.94); }
.icon-btn.off{ color:var(--muted); }

.lang-btn{
  height:36px;
  min-width:38px;
  padding:0 8px;
  display:grid;
  place-items:center;
  background:transparent;
  border:1px solid transparent;
  border-radius:9px;
  color:var(--text2);
  font-size:12px;
  font-weight:600;
  letter-spacing:.4px;
  transition:background .18s, color .18s;
  flex:none;
}
.lang-btn:hover{ background:var(--elev); color:var(--text); }
.lang-btn:active{ transform:scale(.94); }

/* Theme icon – CSS-driven */
#btnTheme .icon-sun{ display:none; }
[data-theme="dark"] #btnTheme .icon-moon{ display:none; }
[data-theme="dark"] #btnTheme .icon-sun{ display:block; }

/* Sound icon – CSS-driven */
#btnSound .icon-sound-off{ display:none; }
#btnSound.off .icon-sound-on{ display:none; }
#btnSound.off .icon-sound-off{ display:block; }

/* ---------- Navigation ---------- */
.tabs{
  display:flex;
  gap:2px;
  background:var(--elev);
  border-radius:999px;
  padding:3px;
  width:100%;
  max-width:460px;
  margin:0 auto;
  flex:none;
}
.tab{
  flex:1 1 0;
  min-width:0;
  padding:8px 4px;
  border:0;
  border-radius:999px;
  background:transparent;
  color:var(--text2);
  font-size:13.5px;
  font-weight:500;
  text-align:center;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  transition:background .18s, color .18s;
}
.tab:hover{ color:var(--text); }
.tab.active{ background:var(--card); color:var(--text); box-shadow:0 1px 3px rgba(0,0,0,.05); }
[data-theme="dark"] .tab.active{ box-shadow:none; }

/* ---------- Views ---------- */
main{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  padding-top:12px;
}
.view{
  display:none;
  flex:1;
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:thin;
}
.view.active{ display:flex; flex-direction:column; }

/* Timer view fills exactly – no scroll */
#view-timer.view{
  overflow:hidden;
  display:none;
  align-items:center;
  justify-content:center;
}
#view-timer.view.active{ display:flex; }

.view-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:10px;
  flex-wrap:wrap;
  flex:none;
}
h2{ font-size:18px; font-weight:600; letter-spacing:-.2px; }

/* ---------- Cards ---------- */
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--r-lg);
  padding:18px;
}
.card + .card{ margin-top:12px; }
.card-title{
  font-size:11.5px;
  font-weight:600;
  letter-spacing:.8px;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:10px;
}

/* ============================================================
   TIMER VIEW – single centered card
   ============================================================ */
.timer-main{
  width:100%;
  max-width:440px;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:16px;
  padding:22px 20px;
}

/* Mode selector */
.mode-selector{
  display:flex;
  gap:2px;
  background:var(--elev);
  border-radius:999px;
  padding:4px;
  width:100%;
  flex:none;
}
.mode-btn{
  flex:1 1 0;
  min-width:0;
  padding:8px 4px;
  border:0;
  border-radius:999px;
  background:transparent;
  color:var(--text2);
  font-size:13px;
  font-weight:500;
  text-align:center;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  transition:background .2s, color .2s;
}
.mode-btn:hover{ color:var(--text); }
.mode-btn.active{ background:var(--card); color:var(--accent); box-shadow:0 1px 2px rgba(0,0,0,.05); }
[data-theme="dark"] .mode-btn.active{ box-shadow:none; }

/* Ring */
.ring-wrap{
  position:relative;
  width:var(--ring-size);
  aspect-ratio:1 / 1;
  flex:none;
  max-width:100%;
}
.ring{ width:100%; height:100%; transform:rotate(-90deg); }
.ring-track{ fill:none; stroke:var(--ring-track); stroke-width:7; }
.ring-progress{
  fill:none;
  stroke:var(--accent);
  stroke-width:7;
  stroke-linecap:round;
  stroke-dasharray:867.08;
  stroke-dashoffset:0;
  transition:stroke-dashoffset .2s linear, stroke .3s ease;
}
.ring-content{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  padding:0 12px;
  text-align:center;
  pointer-events:none;
}
.mode-label{
  font-size:10px;
  font-weight:600;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--accent);
  transition:color .3s;
}
.time{
  font-size:clamp(38px, 10.5vw, 58px);
  font-weight:200;
  letter-spacing:-2px;
  line-height:1.02;
  font-variant-numeric:tabular-nums;
  color:var(--text);
}
.cycle-dots{
  display:flex;
  gap:4px;
  margin-top:2px;
  align-items:center;
}
.cycle-dots i{
  display:block;
  width:5px;
  height:5px;
  border-radius:50%;
  background:var(--border);
  transition:background .2s;
}
.cycle-dots i.done{ background:var(--accent); }
.cycle-dots i.current{ background:var(--accent); box-shadow:0 0 0 2px rgba(217,119,6,.18); }

/* Task pill – integrated current task */
.task-pill{
  display:flex;
  align-items:center;
  gap:10px;
  padding:11px 14px;
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:12px;
  color:var(--text);
  font-size:13.5px;
  font-weight:500;
  text-align:left;
  width:100%;
  min-width:0;
  cursor:pointer;
  transition:background .18s, border-color .18s, transform .1s;
}
.task-pill:hover{ background:var(--elev); border-color:var(--muted); }
.task-pill:active{ transform:scale(.99); }
.task-pill .task-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--accent);
  flex:none;
  transition:background .3s;
}
.task-pill.empty .task-dot{ background:var(--muted); }
.task-pill .task-text{
  flex:1;
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.task-pill.empty .task-text{ color:var(--muted); font-weight:400; }
.task-pill .task-progress{
  font-size:11.5px;
  color:var(--muted);
  flex:none;
  font-variant-numeric:tabular-nums;
}
.task-pill .task-progress:empty{ display:none; }
.task-pill .task-chevron{
  width:14px;
  height:14px;
  color:var(--muted);
  flex:none;
}

/* Controls */
.controls{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  width:100%;
  flex:none;
  flex-wrap:wrap;
}
.btn{
  border-radius:999px;
  border:1px solid transparent;
  font-weight:500;
  transition:background .18s, color .18s, border-color .18s, transform .1s, opacity .18s, filter .18s;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  white-space:nowrap;
}
.btn:active{ transform:scale(.97); }
.btn:disabled{ opacity:.45; cursor:not-allowed; }

.btn-primary{
  background:var(--accent);
  color:#fff;
  font-weight:600;
  padding:11px 32px;
  font-size:15px;
  letter-spacing:.2px;
  box-shadow:var(--shadow);
  min-width:104px;
}
.btn-primary:hover{ filter:brightness(1.06); }

.btn-ghost{
  background:var(--elev);
  color:var(--text2);
  padding:10px 16px;
  font-size:13.5px;
}
.btn-ghost:hover{ background:var(--card); color:var(--text); }

.btn-danger{
  background:transparent;
  border-color:rgba(220,38,38,.45);
  color:var(--danger);
  padding:10px 16px;
  font-size:13.5px;
}
.btn-danger:hover{ background:rgba(220,38,38,.08); }

.btn-sm{ padding:8px 14px; font-size:13px; }

/* Today line */
.today-line{
  font-size:11.5px;
  color:var(--muted);
  text-align:center;
  width:100%;
  min-height:14px;
  line-height:1.2;
}

/* ============================================================
   TASKS VIEW
   ============================================================ */
.task-list{ display:flex; flex-direction:column; gap:8px; padding-bottom:8px; }

.task-row{
  display:flex;
  align-items:center;
  gap:12px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--r);
  padding:12px 14px;
  transition:border-color .18s;
  cursor:pointer;
}
.task-row:hover{ border-color:var(--muted); }
.task-row.active{ border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); }
.task-row.done .task-name{ color:var(--muted); text-decoration:line-through; }
.task-row.done{ opacity:.72; }

.task-check{
  width:20px; height:20px;
  flex:none;
  border-radius:50%;
  border:1.5px solid var(--border);
  background:transparent;
  display:grid;
  place-items:center;
  color:#fff;
  transition:background .18s, border-color .18s;
}
.task-check svg{ width:12px; height:12px; }
.task-row.done .task-check{ background:var(--success); border-color:var(--success); }

.task-body{ flex:1; min-width:0; }
.task-name{
  font-size:14px;
  font-weight:500;
  word-break:break-word;
  overflow-wrap:anywhere;
  margin-bottom:2px;
}
.task-meta{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:11.5px;
  color:var(--muted);
  flex-wrap:wrap;
}
.task-bar{
  display:block;
  width:54px;
  height:3px;
  border-radius:999px;
  background:var(--border);
  overflow:hidden;
}
.task-bar i{
  display:block;
  height:100%;
  background:var(--accent);
  border-radius:999px;
  transition:width .3s ease;
}
.badge{
  font-size:9.5px;
  font-weight:600;
  letter-spacing:.5px;
  text-transform:uppercase;
  color:var(--accent);
  border:1px solid currentColor;
  border-radius:999px;
  padding:0 6px;
}
.task-actions{ display:flex; gap:0; flex:none; }
.task-actions .icon-btn{ width:32px; height:32px; }
.task-actions .icon-btn svg{ width:15px; height:15px; }
.task-actions .icon-btn.danger:hover{ color:var(--danger); }

.empty-state{
  text-align:center;
  color:var(--muted);
  font-size:13px;
  padding:30px 16px;
  border:1px dashed var(--border);
  border-radius:var(--r);
}

/* ============================================================
   STATISTICS VIEW
   ============================================================ */
.stat-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(105px, 1fr));
  gap:8px;
}
.stat{
  background:var(--bg2);
  border-radius:var(--r-sm);
  padding:10px 12px;
}
.stat-value{
  font-size:17px;
  font-weight:600;
  letter-spacing:-.4px;
  color:var(--text);
  line-height:1.25;
}
.stat-label{
  font-size:11px;
  color:var(--muted);
  margin-top:2px;
}

.chart{
  display:flex;
  align-items:flex-end;
  gap:5px;
  height:120px;
  padding-top:10px;
}
.bar-col{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  height:100%;
  gap:4px;
  min-width:0;
}
.bar-value{
  font-size:10.5px;
  color:var(--text2);
  height:14px;
  font-weight:600;
}
.bar-track{
  flex:1;
  width:100%;
  display:flex;
  align-items:flex-end;
  justify-content:center;
}
.bar{
  width:100%;
  max-width:38px;
  background:linear-gradient(180deg, var(--focus), rgba(217,119,6,.42));
  border-radius:4px 4px 2px 2px;
  min-height:3px;
  transition:height .35s ease;
}
[data-theme="dark"] .bar{
  background:linear-gradient(180deg, var(--focus), rgba(245,158,11,.42));
}
.bar.zero{ background:var(--bar-zero); }
.bar-label{
  font-size:10.5px;
  color:var(--muted);
  white-space:nowrap;
}
.bar-label.today{ color:var(--text2); font-weight:600; }

.chart-summary{
  display:flex;
  gap:16px;
  margin-top:10px;
  padding-top:10px;
  border-top:1px solid var(--border);
  flex-wrap:wrap;
}
.chart-summary div{ font-size:12px; color:var(--muted); }
.chart-summary b{ color:var(--text); font-weight:600; }

/* ============================================================
   SETTINGS VIEW – accordion
   ============================================================ */
.settings-card{ padding:2px 16px; }
.acc{ border-bottom:1px solid var(--border); }
.acc:last-child{ border-bottom:0; }
.acc summary{
  cursor:pointer;
  padding:13px 0;
  font-size:14px;
  font-weight:500;
  list-style:none;
  display:flex;
  align-items:center;
  justify-content:space-between;
  color:var(--text);
  gap:12px;
}
.acc summary::-webkit-details-marker{ display:none; }
.acc summary::after{
  content:"";
  width:7px;
  height:7px;
  border-right:1.6px solid var(--muted);
  border-bottom:1.6px solid var(--muted);
  transform:rotate(45deg);
  transition:transform .2s;
  margin-right:3px;
  flex:none;
}
.acc[open] summary::after{ transform:rotate(-135deg); }
.acc-body{ padding-bottom:10px; }

.setting-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:9px 0;
  border-bottom:1px solid var(--border);
  flex-wrap:wrap;
}
.setting-row:last-child{ border-bottom:0; }
.setting-row label{
  flex:1 1 140px;
  min-width:0;
  font-size:13px;
  color:var(--text2);
  cursor:pointer;
}
.row-right{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; flex:0 0 auto; }
.setting-note{
  font-size:11.5px;
  color:var(--muted);
  margin-top:6px;
  line-height:1.5;
}

input[type="number"], input[type="text"], select{
  background:var(--input-bg);
  border:1px solid var(--border);
  border-radius:var(--r-sm);
  padding:7px 10px;
  color:var(--text);
  font-size:13px;
  width:86px;
  transition:border-color .18s;
}
input[type="text"]{ width:100%; }
select{ width:auto; min-width:110px; max-width:190px; }
input[type="number"]:focus, input[type="text"]:focus, select:focus{
  border-color:var(--accent);
  outline:none;
}
input[type="range"]{
  -webkit-appearance:none;
  appearance:none;
  width:120px;
  height:3px;
  border-radius:999px;
  background:var(--border);
  outline:none;
}
input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance:none;
  appearance:none;
  width:14px; height:14px;
  border-radius:50%;
  background:var(--accent);
  cursor:pointer;
  border:0;
}
input[type="range"]::-moz-range-thumb{
  width:14px; height:14px;
  border-radius:50%;
  background:var(--accent);
  cursor:pointer;
  border:0;
}

input.switch{
  -webkit-appearance:none;
  appearance:none;
  width:38px;
  height:22px;
  border-radius:999px;
  background:var(--switch-bg);
  position:relative;
  cursor:pointer;
  flex:none;
  transition:background .2s;
  border:0;
}
input.switch::after{
  content:"";
  position:absolute;
  top:3px; left:3px;
  width:16px; height:16px;
  border-radius:50%;
  background:var(--switch-thumb);
  transition:transform .2s, background .2s;
}
input.switch:checked{ background:var(--accent); }
input.switch:checked::after{ transform:translateX(16px); background:#fff; }

.shortcut-list{ display:flex; flex-direction:column; gap:0; }
.shortcut{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:6px 0;
  font-size:12.5px;
  color:var(--text2);
}
kbd{
  font-family:inherit;
  font-size:10.5px;
  font-weight:600;
  background:var(--elev);
  border:1px solid var(--border);
  border-bottom-width:2px;
  border-radius:5px;
  padding:1px 6px;
  color:var(--text2);
  flex:none;
}

.field{ display:block; margin-bottom:14px; }
.field span{
  display:block;
  font-size:12px;
  color:var(--muted);
  margin-bottom:5px;
}
.field-error{
  color:var(--danger);
  font-size:12px;
  min-height:16px;
}

/* ============================================================
   MODAL
   ============================================================ */
.modal-overlay{
  position:fixed;
  inset:0;
  background:var(--overlay-bg);
  display:grid;
  place-items:center;
  padding:16px;
  z-index:150;
  opacity:0;
  transition:opacity .16s ease;
}
.modal-overlay[hidden]{ display:none; }
.modal-overlay.open{ opacity:1; }
.modal{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--r-lg);
  padding:20px;
  width:min(420px, 100%);
  max-height:82vh;
  overflow:auto;
  transform:translateY(8px) scale(.99);
  transition:transform .18s ease;
}
.modal-overlay.open .modal{ transform:none; }
.modal h3{
  font-size:16px;
  font-weight:600;
  margin-bottom:14px;
}
.modal-body{ margin-bottom:16px; }
.modal-text{
  font-size:13.5px;
  color:var(--text2);
  line-height:1.55;
}
.modal-actions{
  display:flex;
  gap:8px;
  justify-content:flex-end;
  flex-wrap:wrap;
}
.modal-actions .btn{ padding:9px 16px; font-size:13px; }

.picker-list{ display:flex; flex-direction:column; gap:6px; }
.picker-item{
  text-align:left;
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:var(--r-sm);
  padding:10px 12px;
  color:var(--text2);
  font-size:13.5px;
  transition:border-color .16s, color .16s;
  word-break:break-word;
  overflow-wrap:anywhere;
}
.picker-item:hover{ border-color:var(--muted); color:var(--text); }
.picker-item.active{ border-color:var(--accent); color:var(--text); }

/* ============================================================
   TOAST
   ============================================================ */
.toast{
  position:fixed;
  left:50%;
  bottom:calc(18px + env(safe-area-inset-bottom));
  transform:translate(-50%, 14px);
  background:var(--card);
  border:1px solid var(--border);
  color:var(--text);
  padding:10px 16px;
  border-radius:10px;
  font-size:13px;
  opacity:0;
  pointer-events:none;
  transition:opacity .22s ease, transform .22s ease;
  z-index:200;
  max-width:calc(100vw - 32px);
  text-align:center;
  box-shadow:0 8px 24px rgba(0,0,0,.12);
}
[data-theme="dark"] .toast{ box-shadow:0 8px 24px rgba(0,0,0,.6); }
.toast.show{ opacity:1; transform:translate(-50%, 0); }
.toast.success{ border-color:var(--success); }
.toast.error{ border-color:var(--danger); }

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width:640px){
  .topbar{ height:52px; }
  .brand span{ display:none; }
  .icon-btn{ width:34px; height:34px; }
  .icon-btn svg{ width:16px; height:16px; }
  .lang-btn{ height:34px; min-width:36px; font-size:11.5px; }
  main{ padding-top:8px; }
  .card{ padding:14px; }
  .settings-card{ padding:2px 14px; }
  .timer-main{ padding:16px 14px; gap:12px; }
  .btn-primary{ padding:10px 26px; font-size:14px; min-width:92px; }
  .btn-ghost{ padding:9px 13px; font-size:13px; }
  .chart{ height:100px; }
  .acc summary{ padding:12px 0; font-size:13.5px; }
}

@media (max-width:380px){
  .controls{ gap:6px; }
  .btn-primary{ padding:9px 22px; font-size:13.5px; min-width:84px; }
  .btn-ghost{ padding:8px 11px; font-size:12.5px; }
  .tab{ font-size:12.5px; padding:7px 3px; }
  .mode-btn{ font-size:11.5px; padding:7px 3px; }
  .time{ font-size:clamp(34px, 10vw, 50px); }
}

/* Short screens – tighten spacing */
@media (max-height:620px){
  :root{ --ring-size:min(72vw, 34vh, 260px); }
  .timer-main{ padding:14px 16px; gap:10px; }
  .topbar{ height:50px; }
  main{ padding-top:6px; }
}

/* Landscape phones – keep everything on one screen */
@media (max-height:520px){
  :root{ --ring-size:min(50vw, 50vh, 200px); }
  .topbar{ height:40px; }
  .icon-btn{ width:30px; height:30px; }
  .icon-btn svg{ width:15px; height:15px; }
  .lang-btn{ height:30px; min-width:32px; font-size:11px; padding:0 6px; }
  .brand .logo{ width:18px; height:18px; }
  .tabs{ padding:2px; max-width:380px; }
  .tab{ padding:6px 3px; font-size:12px; }
  main{ padding-top:4px; }
  .timer-main{ padding:8px 12px; gap:6px; }
  .mode-selector{ padding:3px; }
  .mode-btn{ padding:6px 3px; font-size:11px; }
  .time{ font-size:clamp(26px, 6vw, 36px); letter-spacing:-1.5px; }
  .mode-label{ font-size:9px; letter-spacing:1.2px; }
  .cycle-dots i{ width:4px; height:4px; }
  .btn-primary{ padding:8px 22px; font-size:13px; min-width:80px; }
  .btn-ghost{ padding:7px 12px; font-size:12px; }
  .task-pill{ padding:8px 12px; font-size:12.5px; }
  .today-line{ display:none; }
}

@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.001ms !important;
    scroll-behavior:auto !important;
  }
}

  function t(key) {
    const lang = state.settings.language || 'vi';
    let str = (translations[lang] && translations[lang][key]) || translations.en[key] || key;
    for (let i = 1; i < arguments.length; i++) {

  /* ============================================================
     3. STORAGE
     ============================================================ */

  let storageOK = true;
  let storageWarned = false;
  let saveTimer = null;

  function checkStorage() {
    try {
      const k = '__pomodoro_test__';
      window.localStorage.setItem(k, '1');
      window.localStorage.removeItem(k);
      storageOK = true;
    } catch (e) { storageOK = false; }
  }

  function writeStorage() {
    if (!storageOK) return;

      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      if (!storageWarned) { storageWarned = true; showToast(t('storageUnavailable'), 'error'); }
      try {
        if (state.sessions.length > 2000) {
          state.sessions = state.sessions.slice(-2000);
          window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state));

      } catch (e2) {}
    }
  }
  function save() {
    if (saveTimer) clearTimeout(saveTimer);

  }
  function saveNow() {
    if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
    writeStorage();
  }

  /* ============================================================
     4. STATE
     ============================================================ */

  let state = null;

  function createDefaultState() {
    const s = deepCopy(DEFAULT_SETTINGS);
    return {
      version: SCHEMA_VERSION,
      settings: s,
      tasks: [],
      sessions: [],
      activeTaskId: null,
      timer: {
        mode: 'focus', status: 'idle',
        endAt: null,
        remainingMs: s.focusMin * 60000,
        plannedMs: s.focusMin * 60000,
        startedAt: null,
        cyclePos: 0
      }
    };
  }

  function numOr(v, fb, min, max) {
    const n = Number(v);
    if (!isFinite(n)) return fb;
    return clamp(n, min, max);
  }
  function boolOr(v, fb) { return typeof v === 'boolean' ? v : fb; }

  function sanitizeSettings(raw) {
    const d = DEFAULT_SETTINGS;
    if (!raw || typeof raw !== 'object') return deepCopy(d);
    return {
      focusMin: Math.round(numOr(raw.focusMin, d.focusMin, 1, 180)),
      shortMin: Math.round(numOr(raw.shortMin, d.shortMin, 1, 60)),
      longMin: Math.round(numOr(raw.longMin, d.longMin, 1, 120)),
      longEvery: Math.round(numOr(raw.longEvery, d.longEvery, 2, 12)),
      autoTransition: boolOr(raw.autoTransition, d.autoTransition),
      autoStartBreaks: boolOr(raw.autoStartBreaks, d.autoStartBreaks),
      autoStartFocus: boolOr(raw.autoStartFocus, d.autoStartFocus),
      soundEnabled: boolOr(raw.soundEnabled, d.soundEnabled),
      soundPreset: SOUND_PRESETS.indexOf(raw.soundPreset) >= 0 ? raw.soundPreset : d.soundPreset,
      volume: numOr(raw.volume, d.volume, 0, 1),
      playStartSound: boolOr(raw.playStartSound, d.playStartSound),
      browserNotifications: boolOr(raw.browserNotifications, d.browserNotifications),
      inAppNotifications: boolOr(raw.inAppNotifications, d.inAppNotifications),
      keepAwake: boolOr(raw.keepAwake, d.keepAwake),
      language: (raw.language === 'en' || raw.language === 'vi') ? raw.language : d.language,
      theme: (raw.theme === 'dark' || raw.theme === 'light') ? raw.theme : d.theme
    };
  }

  function normalizeTask(raw, seen) {
    let id = (typeof raw.id === 'string' && raw.id) ? raw.id : uid();
    while (seen.has(id)) id = uid();
    seen.add(id);
    return {
      id: id,
      name: String(raw.name || '').slice(0, 140).trim() || '—',
      createdAt: numOr(raw.createdAt, Date.now(), 0, Number.MAX_SAFE_INTEGER),
      done: !!raw.done,
      doneAt: raw.done ? numOr(raw.doneAt, Date.now(), 0, Number.MAX_SAFE_INTEGER) : null,
      target: Math.round(numOr(raw.target, 0, 0, 99)),
      completedPomodoros: Math.round(numOr(raw.completedPomodoros, 0, 0, 100000))
    };
  }

  function isValidSession(raw) {
    return raw && typeof raw === 'object' && typeof raw.mode === 'string' &&
      isFinite(Number(raw.endedAt)) && isFinite(Number(raw.durationMs));
  }
  function normalizeSession(raw) {
    return {
      id: typeof raw.id === 'string' ? raw.id : uid(),
      mode: raw.mode === 'focus' ? 'focus' : (raw.mode === 'short' ? 'short' : 'long'),
      taskId: typeof raw.taskId === 'string' ? raw.taskId : null,
      taskName: typeof raw.taskName === 'string' ? raw.taskName.slice(0, 140) : '',
      startedAt: numOr(raw.startedAt, Number(raw.endedAt) - Number(raw.durationMs), 0, Number.MAX_SAFE_INTEGER),
      endedAt: numOr(raw.endedAt, Date.now(), 0, Number.MAX_SAFE_INTEGER),
      durationMs: numOr(raw.durationMs, 0, 0, 24 * 3600 * 1000)
    };
  }

  function sanitizeState(raw, base) {
    const out = base || createDefaultState();
    if (!raw || typeof raw !== 'object') return out;
    out.settings = sanitizeSettings(raw.settings);
    if (Array.isArray(raw.tasks)) {
      const seen = new Set();
      out.tasks = raw.tasks
        .filter(function (tt) { return tt && typeof tt === 'object' && typeof tt.name === 'string'; })
        .slice(0, 1000)
        .map(function (tt) { return normalizeTask(tt, seen); });
    }
    if (Array.isArray(raw.sessions)) {
      out.sessions = raw.sessions.filter(isValidSession).slice(-20000).map(normalizeSession);
    }
    if (typeof raw.activeTaskId === 'string') out.activeTaskId = raw.activeTaskId;
    if (out.activeTaskId && !out.tasks.some(function (tt) { return tt.id === out.activeTaskId; })) {
      out.activeTaskId = null;
    }
    if (raw.timer && typeof raw.timer === 'object') {
      const tm = raw.timer;
      const mode = (tm.mode === 'focus' || tm.mode === 'short' || tm.mode === 'long') ? tm.mode : 'focus';
      const status = (tm.status === 'running' || tm.status === 'paused' ||
                      tm.status === 'completed' || tm.status === 'idle') ? tm.status : 'idle';
      const planned = numOr(tm.plannedMs, durationFor(mode, out.settings), 1000, 24 * 3600 * 1000);
      out.timer = {
        mode: mode,
        status: status === 'completed' ? 'idle' : status,
        endAt: (status === 'running' && isFinite(Number(tm.endAt))) ? Number(tm.endAt) : null,
        remainingMs: numOr(tm.remainingMs, planned, 0, 24 * 3600 * 1000),
        plannedMs: planned,
        startedAt: isFinite(Number(tm.startedAt)) ? Number(tm.startedAt) : null,
        cyclePos: Math.round(numOr(tm.cyclePos, 0, 0, 1000))
      };
      if (out.timer.status === 'running' && !out.timer.endAt) out.timer.status = 'paused';
    }
    return out;
  }

  function loadState() {
    const fallback = createDefaultState();
    if (!storageOK) return fallback;
    let raw;
    try { raw = window.localStorage.getItem(STORAGE_KEY); }
    catch (e) { storageOK = false; return fallback; }
    if (!raw) return fallback;
    let parsed;
    try { parsed = JSON.parse(raw); }
    catch (e) { return fallback; }
    if (!parsed || typeof parsed !== 'object') return fallback;
    return sanitizeState(parsed, fallback);
  }

  function getTaskById(id) {
    if (!id) return null;
    for (let i = 0; i < state.tasks.length; i++) {
      if (state.tasks[i].id === id) return state.tasks[i];
    }
    return null;
  }

  /* ============================================================
     5. AUDIO
     ============================================================ */

  let audioCtx = null;
  let masterGain = null;

  function ensureAudio() {
    if (audioCtx) {
      if (audioCtx.state === 'suspended') audioCtx.resume().catch(function () {});
      return audioCtx;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try {
      audioCtx = new AC();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = state ? state.settings.volume : 0.6;
      masterGain.connect(audioCtx.destination);
    } catch (e) { audioCtx = null; masterGain = null; }
    return audioCtx;
  }
  function applyVolume(v) {
    if (masterGain && audioCtx) {
      try { masterGain.gain.setValueAtTime(v, audioCtx.currentTime); } catch (e) {}
    }
  }
  function playTone(freq, offset, duration, type, peak) {
    const ctx = audioCtx;
    if (!ctx || !masterGain) return;
    try {
      const t0 = ctx.currentTime + offset;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, t0);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(Math.max(0.001, peak || 0.25), t0 + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
      osc.connect(gain);
      gain.connect(masterGain);
      osc.start(t0);
      osc.stop(t0 + duration + 0.05);
    } catch (e) {}
  }
  function playPreset(preset) {
    const ctx = ensureAudio();
    if (!ctx) return;
    switch (preset) {
      case 'bell':
        playTone(880, 0, 1.6, 'sine', 0.30);
        playTone(1320, 0, 1.2, 'sine', 0.12);
        playTone(1760, 0, 0.9, 'sine', 0.06);
        break;
      case 'alarm':
        for (let i = 0; i < 4; i++) {
          playTone(660, i * 0.30, 0.16, 'square', 0.14);
          playTone(990, i * 0.30 + 0.15, 0.12, 'square', 0.10);
        }
        break;
      case 'chime':
        [523.25, 659.25, 783.99, 1046.50].forEach(function (f, i) {
          playTone(f, i * 0.16, 1.1, 'sine', 0.22);
        });
        break;
      case 'beep':
      default:
        playTone(880, 0, 0.14, 'sine', 0.30);
        playTone(880, 0.22, 0.14, 'sine', 0.30);
    }
  }
  function playCompletionSound() {
    if (!state.settings.soundEnabled) return;
    playPreset(state.settings.soundPreset);
  }

  /* ============================================================
     6. NOTIFICATIONS
     ============================================================ */

  let toastTimer = null;

  function showToast(msg, type) {
    const el = $('#toast');
    if (!el) return;
    el.textContent = msg;
    el.className = 'toast show' + (type ? ' ' + type : '');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.className = 'toast'; }, 3200);
  }
  function canNotify() { return typeof window.Notification !== 'undefined'; }
  function notifyPermission() {
    if (!canNotify()) return 'unsupported';
    return window.Notification.permission;
  }
  function requestNotifPermission() {
    if (!canNotify()) return Promise.resolve('unsupported');
    return new Promise(function (resolve) {
      try {
        const result = window.Notification.requestPermission(function (perm) { resolve(perm); });
        if (result && typeof result.then === 'function') result.then(resolve).catch(function () { resolve('denied'); });
      } catch (e) { resolve('denied'); }

  }
  function sendBrowserNotification(title, body) {
    if (!state.settings.browserNotifications) return;
    if (!canNotify() || window.Notification.permission !== 'granted') return;
    try { new window.Notification(title, { body: body, tag: 'pomodoro', silent: false }); } catch (e) {}
  }
  function notifyUser(title, body) {
    sendBrowserNotification(title, body);
    if (state.settings.inAppNotifications) showToast(title, 'success');
  }

  /* ============================================================
     7. TIMER ENGINE
     ============================================================ */

  let tickHandle = null;

  function durationFor(mode, settings) {
    const s = settings || state.settings;
    if (mode === 'short') return Math.round(s.shortMin * 60000);
    if (mode === 'long') return Math.round(s.longMin * 60000);
    return Math.round(s.focusMin * 60000);

  function stopTicking() {

  }
  function tick() {
    const tm = state.timer;
    if (tm.status !== 'running' || !tm.endAt) return;
    const remaining = tm.endAt - Date.now();
    if (remaining <= 0) {
      tm.remainingMs = 0;
      renderTimerDisplay();
      handleCompletion({});
      return;
    }
    tm.remainingMs = remaining;
    renderTimerDisplay();
  }

  function startTimer() {
    const tm = state.timer;
    if (tm.status === 'running') return;
    if (tm.status === 'paused' && tm.remainingMs > 0) {
      tm.endAt = Date.now() + tm.remainingMs;
    } else {
      tm.plannedMs = durationFor(tm.mode);
      tm.remainingMs = tm.plannedMs;
      tm.startedAt = Date.now();
      tm.endAt = tm.startedAt + tm.plannedMs;
    }
    tm.status = 'running';
    beginTicking();
    updateWakeLock();
    if (state.settings.soundEnabled && state.settings.playStartSound) {
      playPreset(state.settings.soundPreset);
    }
    saveNow();
    renderTimer();
  }

  function pauseTimer() {
    const tm = state.timer;
    if (tm.status !== 'running') return;
    tm.remainingMs = Math.max(0, tm.endAt - Date.now());
    tm.endAt = null;
    tm.status = 'paused';
    stopTicking();
    updateWakeLock();
    saveNow();
    renderTimer();
  }

  function toggleTimer() {
    if (state.timer.status === 'running') pauseTimer();
    else startTimer();

  function resetTimer() {
    const tm = state.timer;
    stopTicking();
    tm.status = 'idle';
    tm.endAt = null;
    tm.startedAt = null;
    tm.plannedMs = durationFor(tm.mode);
    tm.remainingMs = tm.plannedMs;
    updateWakeLock();
    saveNow();
    renderTimer();
  }

  function setMode(mode, opts) {
    opts = opts || {};
    if (mode !== 'focus' && mode !== 'short' && mode !== 'long') return;
    const tm = state.timer;
    stopTicking();
    tm.mode = mode;
    tm.status = 'idle';
    tm.endAt = null;
    tm.startedAt = null;
    tm.plannedMs = durationFor(mode);
    tm.remainingMs = tm.plannedMs;
    document.body.dataset.mode = mode;
    updateWakeLock();
    if (!opts.skipSave) saveNow();
    renderTimer();
    renderTaskPill();
  }

  function skipSession() {
    const tm = state.timer;
    const current = tm.mode;
    let next;
    if (current === 'focus') next = 'short';
    else {
      next = 'focus';
      if (current === 'long') tm.cyclePos = 0;
    }
    setMode(next);
    const modeName = next === 'focus' ? t('modeFocus') : next === 'short' ? t('modeShort') : t('modeLong');
    showToast(t('skippedTo', modeName));
  }

  function handleCompletion(opts) {
    opts = opts || {};
    const tm = state.timer;
    if (tm.status === 'completed') return;
    const mode = tm.mode;
    const planned = tm.plannedMs || durationFor(mode);
    const endedAt = tm.endAt || Date.now();
    const startedAt = tm.startedAt || (endedAt - planned);
    stopTicking();
    tm.status = 'completed';
    tm.remainingMs = 0;
    let nextMode;
    if (mode === 'focus') {
      const task = getTaskById(state.activeTaskId);
      state.sessions.push({
        id: uid(), mode: 'focus',
        taskId: task ? task.id : null, taskName: task ? task.name : '',
        startedAt: startedAt, endedAt: endedAt, durationMs: planned
      });
      if (state.sessions.length > 20000) state.sessions = state.sessions.slice(-20000);
      if (task) task.completedPomodoros = (task.completedPomodoros || 0) + 1;
      tm.cyclePos = (tm.cyclePos || 0) + 1;
      nextMode = (tm.cyclePos >= state.settings.longEvery) ? 'long' : 'short';
    } else {
      nextMode = 'focus';
      if (mode === 'long') tm.cyclePos = 0;
    }
    playCompletionSound();
    const title = mode === 'focus' ? t('focusComplete')
      : (mode === 'short' ? t('shortBreakOver') : t('longBreakOver'));
    const body = mode === 'focus'
      ? t('timeForBreak', nextMode === 'long' ? t('modeLong').toLowerCase() : t('modeShort').toLowerCase())
      : t('readyToFocus');
    notifyUser(title, body);
    setMode(nextMode, { skipSave: true });
    saveNow();
    const autoStart = state.settings.autoTransition &&
      (nextMode === 'focus' ? state.settings.autoStartFocus : state.settings.autoStartBreaks);
    if (autoStart && !opts.noAutoStart) {
      setTimeout(function () {
        if (state.timer.status === 'idle') startTimer();
      }, 600);
    }
    renderAll();
  }

  function reconcileTimer() {
    const tm = state.timer;
    if (tm.status === 'running' && tm.endAt) {
      if (Date.now() >= tm.endAt) {
        handleCompletion({ noAutoStart: true });
        showToast(t('sessionFinishedAway'), 'success');
      } else {
        tm.remainingMs = tm.endAt - Date.now();
        beginTicking();
        updateWakeLock();
      }
    } else if (tm.status === 'paused') {
      if (!isFinite(tm.remainingMs) || tm.remainingMs <= 0) resetTimer();
    } else {
      tm.status = 'idle';
    }
    saveNow();
    renderTimer();
  }

  /* ============================================================
     8. TASKS
     ============================================================ */

  function setActiveTask(id) {
    state.activeTaskId = id || null;
    save();
    renderTaskPill();
    renderTasks();
  }
  function createTask(name, target) {
    const task = {
      id: uid(),
      name: String(name).slice(0, 140).trim(),
      createdAt: Date.now(),
      done: false, doneAt: null,
      target: Math.round(clamp(Number(target) || 0, 0, 99)),
      completedPomodoros: 0
    };
    state.tasks.push(task);
    saveNow();
    renderTasks();
    renderTaskPill();
    return task;
  }
  function updateTask(id, name, target) {
    const task = getTaskById(id);
    if (!task) return;
    task.name = String(name).slice(0, 140).trim();
    task.target = Math.round(clamp(Number(target) || 0, 0, 99));
    saveNow();
    renderTasks();
    renderTaskPill();
  }
  function toggleTaskDone(id) {
    const task = getTaskById(id);
    if (!task) return;
    task.done = !task.done;
    task.doneAt = task.done ? Date.now() : null;
    if (task.done && state.activeTaskId === task.id) state.activeTaskId = null;
    saveNow();
    renderTasks();
    renderTaskPill();
    renderStats();
  }
  function deleteTask(id) {
    const task = getTaskById(id);
    if (!task) return;
    confirmDialog(
      t('deleteTaskTitle'),
      t('deleteTaskMessage', task.name),
      t('deleteConfirm'),
      true
    ).then(function (ok) {
      if (!ok) return;
      state.tasks = state.tasks.filter(function (tt) { return tt.id !== id; });
      if (state.activeTaskId === id) state.activeTaskId = null;
      saveNow();
      renderTasks();
      renderTaskPill();
      renderStats();
      showToast(t('taskDeleted'));
    });
  }

  /* ============================================================
     9. STATISTICS
     ============================================================ */

  function buildDayMap() {
    const map = {};
    for (let i = 0; i < state.sessions.length; i++) {
      const s = state.sessions[i];
      if (s.mode !== 'focus') continue;
      const key = dateKey(s.endedAt);
      if (!map[key]) map[key] = { count: 0, ms: 0 };
      map[key].count++;
      map[key].ms += s.durationMs || 0;
    }
    return map;
  }
  function computeStreak(map) {
    let streak = 0;
    const d = new Date();
    d.setHours(12, 0, 0, 0);
    if (!(map[dateKey(d)] && map[dateKey(d)].count > 0)) d.setDate(d.getDate() - 1);
    while (map[dateKey(d)] && map[dateKey(d)].count > 0) {
      streak++;
      d.setDate(d.getDate() - 1);
      if (streak > 3650) break;
    }
    return streak;
  }
  function statCard(value, label) {
    return '<div class="stat"><div class="stat-value">' + esc(value) +
           '</div><div class="stat-label">' + esc(label) + '</div></div>';
  }

  function renderStats() {
    const map = buildDayMap();
    const todayKey = dateKey(Date.now());
    const today = map[todayKey] || { count: 0, ms: 0 };
    const completedTasksToday = state.tasks.filter(function (tt) {
      return tt.done && tt.doneAt && dateKey(tt.doneAt) === todayKey;
    }).length;

    const todayEl = $('#todayStats');
    if (todayEl) {
      todayEl.innerHTML = [
        statCard(today.count, t('focusSessions')),
        statCard(formatDuration(today.ms), t('focusTime')),
        statCard(completedTasksToday, t('tasksCompleted')),
        statCard(today.count ? formatDuration(today.ms / today.count) : '—', t('avgSession')),
        statCard(Math.floor(today.count / state.settings.longEvery), t('cyclesCompleted'))
      ].join('');
    }

    const chartEl = $('#weekChart');
    const summaryEl = $('#weekSummary');
    const dayNames = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
    const days = [];
    let maxCount = 1, weekCount = 0, weekMs = 0;

    for (let i = 6; i >= 0; i--) {
      const d = new Date();
      d.setHours(12, 0, 0, 0);
      d.setDate(d.getDate() - i);
      const key = dateKey(d);
      const data = map[key] || { count: 0, ms: 0 };
      days.push({
        key: key, label: dayNames[d.getDay()], dayNum: d.getDate(),
        isToday: key === todayKey, count: data.count, ms: data.ms
      });
      if (data.count > maxCount) maxCount = data.count;
      weekCount += data.count;
      weekMs += data.ms;
    }

    if (chartEl) {
      if (weekCount === 0) {
        chartEl.innerHTML = '<div class="empty-state" style="width:100%;align-self:center;">' +
          esc(t('noFocusSessions')) + '</div>';
      } else {
        chartEl.innerHTML = days.map(function (d) {
          const pct = d.count > 0 ? Math.max(4, (d.count / maxCount) * 100) : 0;
          return '<div class="bar-col">' +
            '<div class="bar-value">' + (d.count ? d.count : '') + '</div>' +
            '<div class="bar-track"><div class="bar' + (d.count ? '' : ' zero') +
              '" style="height:' + pct.toFixed(1) + '%"></div></div>' +
            '<div class="bar-label' + (d.isToday ? ' today' : '') + '">' +
              esc(d.label) + '</div></div>';
        }).join('');
      }
    }
    if (summaryEl) {
      summaryEl.innerHTML =
        '<div>' + esc(t('weekTotal')) + ': <b>' + formatDuration(weekMs) + '</b></div>' +
        '<div>' + esc(t('sessions')) + ': <b>' + weekCount + '</b></div>' +
        '<div>' + esc(t('dailyAverage')) + ': <b>' + formatDuration(weekMs / 7) + '</b></div>';
    }

    const allEl = $('#allTimeStats');
    if (allEl) {
      let totalCount = 0, totalMs = 0;
      let bestDayKey = null, bestDayCount = 0, longestDayMs = 0;
      Object.keys(map).forEach(function (key) {
        totalCount += map[key].count;
        totalMs += map[key].ms;
        if (map[key].count > bestDayCount) { bestDayCount = map[key].count; bestDayKey = key; }
        if (map[key].ms > longestDayMs) { longestDayMs = map[key].ms; }
      });
      const streak = computeStreak(map);
      const fmtDate = function (key) {
        if (!key) return '—';
        const p = key.split('-');
        const d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
        return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
      };
      allEl.innerHTML = [
        statCard(totalCount, t('totalSessions')),
        statCard(formatDuration(totalMs), t('totalFocusTime')),
        statCard(bestDayKey ? fmtDate(bestDayKey) : '—', t('mostProductiveDay')),
        statCard(longestDayMs ? formatDuration(longestDayMs) : '—', t('longestDailyFocus')),
        statCard(streak + 'd', t('currentStreak'))
      ].join('');
    }
  }

  /* ============================================================
     10. RENDERING
     ============================================================ */

  function renderTimerDisplay() {
    const tm = state.timer;
    const total = tm.plannedMs || durationFor(tm.mode);
    const remaining = Math.max(0, tm.remainingMs || 0);
    const timeEl = $('#timeDisplay');
    const text = formatTime(remaining);
    if (timeEl && timeEl.textContent !== text) timeEl.textContent = text;
    const progress = total > 0 ? clamp(remaining / total, 0, 1) : 0;
    const ring = $('#ringProgress');
    if (ring) ring.style.strokeDashoffset = String(RING_C * (1 - progress));
    const modeName = tm.mode === 'focus' ? t('modeFocus') : tm.mode === 'short' ? t('modeShort') : t('modeLong');
    document.title = text + ' | ' + modeName + ' | ' + t('appName');
  }

  function renderCycleDots() {
    const el = $('#cycleDots');
    if (!el) return;
    const total = state.settings.longEvery;
    const done = Math.min(state.timer.cyclePos || 0, total);
    let html = '';
    for (let i = 0; i < total; i++) {
      let cls = '';
      if (i < done) cls = 'done';
      else if (i === done && state.timer.mode === 'focus') cls = 'current';
      html += '<i class="' + cls + '"></i>';
    }
    el.innerHTML = html;
  }

  function renderTimer() {
    const tm = state.timer;
    document.body.dataset.mode = tm.mode;

    $$('.mode-btn').forEach(function (btn) {
      const on = btn.dataset.mode === tm.mode;
      btn.classList.toggle('active', on);
      btn.setAttribute('aria-selected', on ? 'true' : 'false');
    });

    const modeLabel = $('#modeLabel');
    if (modeLabel) {
      modeLabel.textContent = tm.mode === 'focus' ? t('modeFocus')
        : tm.mode === 'short' ? t('modeShort') : t('modeLong');
    }

    const btnStart = $('#btnStart');
    if (btnStart) {
      btnStart.textContent = tm.status === 'running' ? t('btnPause')
        : (tm.status === 'paused' ? t('btnResume') : t('btnStart'));
    }

    renderCycleDots();
    renderTimerDisplay();
    renderTodayLine();
  }

  function renderTodayLine() {
    const el = $('#todayLine');
    if (!el) return;
    const map = buildDayMap();
    const today = map[dateKey(Date.now())] || { count: 0, ms: 0 };
    if (today.count === 0 && today.ms === 0) { el.textContent = ''; return; }
    el.textContent = today.count + ' ' + t('sessions') + ' · ' + formatDuration(today.ms);
  }

  function renderTaskPill() {
    const pill = $('#taskPillBtn');
    const txt = $('#taskPillTxt');
    const prog = $('#taskPillProgress');
    if (!pill || !txt) return;

    const task = getTaskById(state.activeTaskId);

    if (!task) {
      pill.classList.add('empty');
      txt.textContent = t('noTaskShort');
      if (prog) prog.textContent = '';
      return;
    }

    pill.classList.remove('empty');
    txt.textContent = task.name;
    if (prog) {
      prog.textContent = task.target > 0
        ? (task.completedPomodoros || 0) + '/' + task.target
        : '';
    }
  }

  const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" ' +
    'stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
  const PENCIL_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" ' +
    'stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
  const TRASH_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" ' +
    'stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/>' +
    '<path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>';

  function taskRowHTML(task) {
    const active = task.id === state.activeTaskId;
    const pct = task.target > 0 ? clamp(((task.completedPomodoros || 0) / task.target) * 100, 0, 100) : 0;
    let meta = '<span>' + (task.completedPomodoros || 0) + (task.target > 0 ? '/' + task.target : '') + '</span>';
    if (task.target > 0) meta += '<span class="task-bar"><i style="width:' + pct.toFixed(0) + '%"></i></span>';
    if (active) meta += '<span class="badge">' + esc(t('active')) + '</span>';

    return '<div class="task-row' + (task.done ? ' done' : '') + (active ? ' active' : '') +
      '" data-id="' + esc(task.id) + '">' +
        '<button class="task-check" data-act="toggle" aria-label="' +
          esc(task.done ? t('ariaReopenTask') : t('ariaCompleteTask')) + '">' + (task.done ? CHECK_SVG : '') + '</button>' +
        '<div class="task-body">' +
          '<div class="task-name">' + esc(task.name) + '</div>' +
          '<div class="task-meta">' + meta + '</div>' +
        '</div>' +
        '<div class="task-actions">' +
          '<button class="icon-btn" data-act="edit" aria-label="' + esc(t('ariaEditTask')) + '">' + PENCIL_SVG + '</button>' +
          '<button class="icon-btn danger" data-act="delete" aria-label="' + esc(t('ariaDeleteTask')) + '">' + TRASH_SVG + '</button>' +
        '</div></div>';
  }

  function renderTasks() {
    const list = $('#taskList');
    if (!list) return;
    if (!state.tasks.length) {
      list.innerHTML = '<div class="empty-state">' + esc(t('noTasks')) + '</div>';
      return;
    }
    const sorted = state.tasks.slice().sort(function (a, b) {
      if (a.done !== b.done) return a.done ? 1 : -1;
      return a.createdAt - b.createdAt;
    });
    list.innerHTML = sorted.map(taskRowHTML).join('');
  }

  function renderSoundButton() {
    const btn = $('#btnSound');
    if (!btn) return;
    btn.classList.toggle('off', !state.settings.soundEnabled);
    btn.setAttribute('aria-pressed', state.settings.soundEnabled ? 'true' : 'false');
  }

  function applyTheme(theme) {
    document.body.dataset.theme = theme;
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.content = theme === 'dark' ? '#000000' : '#ffffff';
    const btn = $('#btnTheme');
    if (btn) {
      const label = theme === 'light' ? t('switchToDark') : t('switchToLight');
      btn.title = label;
      btn.setAttribute('aria-label', label);
    }
  }

  function applyTranslations() {
    document.querySelectorAll('[data-i18n]').forEach(function (el) {
      el.textContent = t(el.dataset.i18n);
    });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(function (el) {
      el.placeholder = t(el.dataset.i18nPlaceholder);
    });
    document.querySelectorAll('[data-i18n-title]').forEach(function (el) {
      el.title = t(el.dataset.i18nTitle);
    });
    document.querySelectorAll('[data-i18n-aria-label]').forEach(function (el) {
      el.setAttribute('aria-label', t(el.dataset.i18nAriaLabel));
    });

    const langBtn = $('#btnLang');
    if (langBtn) langBtn.textContent = state.settings.language === 'vi' ? 'VI' : 'EN';
    document.documentElement.lang = state.settings.language;

    updateNotifNote();
    renderTaskPill();
    renderTasks();
    renderStats();
    renderTimer();
    renderSoundButton();
    applyTheme(state.settings.theme);
  }

  function renderAll() {
    renderTimer();
    renderTaskPill();
    renderTasks();
    renderStats();
    renderSoundButton();
    applyTheme(state.settings.theme);
  }

  /* ============================================================
     11. MODAL
     ============================================================ */

  let modalOnClose = null;

  function openModal(config) {
    const overlay = $('#modalOverlay');
    const titleEl = $('#modalTitle');
    const bodyEl = $('#modalBody');
    const actionsEl = $('#modalActions');
    titleEl.textContent = config.title || '';
    bodyEl.innerHTML = config.bodyHTML || '';
    actionsEl.innerHTML = '';
    (config.actions || []).forEach(function (action) {
      const btn = document.createElement('button');
      btn.className = 'btn ' + (action.className || 'btn-ghost');
      btn.textContent = action.label;
      btn.addEventListener('click', function () { if (action.onClick) action.onClick(); });
      actionsEl.appendChild(btn);
    });
    overlay.hidden = false;
    requestAnimationFrame(function () { overlay.classList.add('open'); });
    if (config.onMount) config.onMount(bodyEl);
    const firstField = bodyEl.querySelector('input, select, textarea');
    if (firstField) setTimeout(function () { firstField.focus(); }, 60);
  }

  function closeModal() {
    const overlay = $('#modalOverlay');
    if (!overlay || overlay.hidden) return;
    overlay.classList.remove('open');
    setTimeout(function () { overlay.hidden = true; }, 170);
    if (modalOnClose) { const cb = modalOnClose; modalOnClose = null; cb(); }
  }

  function confirmDialog(title, message, confirmLabel, danger) {
    return new Promise(function (resolve) {
      let settled = false;
      const settle = function (v) {
        if (settled) return;
        settled = true;
        modalOnClose = null;
        resolve(v);
      };
      modalOnClose = function () { settle(false); };
      openModal({
        title: title,
        bodyHTML: '<p class="modal-text">' + esc(message) + '</p>',
        actions: [
          { label: t('cancel'), className: 'btn-ghost', onClick: function () { closeModal(); settle(false); } },
          { label: confirmLabel || t('save'), className: danger ? 'btn-danger' : 'btn-primary',
            onClick: function () { closeModal(); settle(true); } }
        ]
      });
    });
  }

  function openTaskEditor(task) {
    const isNew = !task;
    const currentName = isNew ? '' : task.name;
    const currentTarget = (isNew || !task.target) ? '' : String(task.target);
    modalOnClose = null;
    openModal({
      title: isNew ? t('newTaskTitle') : t('editTaskTitle'),
      bodyHTML:
        '<label class="field"><span>' + esc(t('taskName')) + '</span>' +
          '<input type="text" id="taskNameInput" maxlength="140" ' +
            'placeholder="' + esc(t('taskNamePlaceholder')) + '" value="' + esc(currentName) + '"></label>' +
        '<label class="field"><span>' + esc(t('targetSessions')) + '</span>' +
          '<input type="number" id="taskTargetInput" min="1" max="99" inputmode="numeric" ' +
            'placeholder="' + esc(t('targetSessionsPlaceholder')) + '" value="' + esc(currentTarget) + '"></label>' +
        '<div class="field-error" id="taskError"></div>',
      actions: [
        { label: t('cancel'), className: 'btn-ghost', onClick: function () { modalOnClose = null; closeModal(); } },
        { label: isNew ? t('create') : t('save'), className: 'btn-primary', onClick: function () { submitTaskEditor(task); } }
      ],
      onMount: function (body) {
        const nameInput = body.querySelector('#taskNameInput');
        nameInput.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') { e.preventDefault(); submitTaskEditor(task); }
        });
      }
    });
  }

  function submitTaskEditor(task) {
    const nameInput = $('#taskNameInput');
    const targetInput = $('#taskTargetInput');
    const errorEl = $('#taskError');
    if (!nameInput) return;
    const name = nameInput.value.trim();
    if (!name) {
      if (errorEl) errorEl.textContent = t('taskNameRequired');
      nameInput.focus();
      return;
    }
    let target = 0;
    if (targetInput && targetInput.value.trim() !== '') {
      const parsed = parseInt(targetInput.value, 10);
      if (isNaN(parsed) || parsed < 1 || parsed > 99) {
        if (errorEl) errorEl.textContent = t('targetRange');
        targetInput.focus();
        return;
      }
      target = parsed;
    }
    if (task) {
      updateTask(task.id, name, target);
      showToast(t('taskUpdated'));
    } else {
      const created = createTask(name, target);
      setActiveTask(created.id);
      showToast(t('taskCreated'));
    }
    modalOnClose = null;
    closeModal();
  }

  function openTaskPicker() {
    const open = state.tasks.filter(function (tt) { return !tt.done; });
    const hasActive = !!state.activeTaskId;
    let html;

    if (!open.length) {
      html = '<p class="modal-text">' + esc(t('noTasks')) + '</p>';
    } else {
      html = '<div class="picker-list">' + open.map(function (tt) {
        return '<button class="picker-item' + (tt.id === state.activeTaskId ? ' active' : '') +
          '" data-pick="' + esc(tt.id) + '">' + esc(tt.name) + '</button>';
      }).join('') + '</div>';
    }

    const actions = [
      { label: t('newTask'), className: 'btn-ghost', onClick: function () {
          modalOnClose = null; closeModal();
          setTimeout(function () { openTaskEditor(null); }, 190);
      }}
    ];

    if (hasActive) {
      actions.push({
        label: t('clearCurrent'),
        className: 'btn-ghost',
        onClick: function () {
          setActiveTask(null);
          modalOnClose = null;
          closeModal();
          showToast(t('currentTaskCleared'));
        }
      });
    }

    actions.push({
      label: t('close'),
      className: 'btn-primary',
      onClick: function () { modalOnClose = null; closeModal(); }
    });

    modalOnClose = null;
    openModal({
      title: t('selectTask'),
      bodyHTML: html,
      actions: actions,
      onMount: function (body) {
        body.querySelectorAll('[data-pick]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            setActiveTask(btn.dataset.pick);
            modalOnClose = null;
            closeModal();
            showToast(t('taskSelected'));
          });
        });
      }
    });
  }

  /* ============================================================
     12. FULLSCREEN & WAKE LOCK
     ============================================================ */

  function toggleFullscreen() {
    const doc = document;
    const el = doc.documentElement;
    if (!doc.fullscreenElement && !doc.webkitFullscreenElement) {
      const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
      if (req) {
        try {
          const p = req.call(el);
          if (p && typeof p.catch === 'function') p.catch(function () { showToast(t('fullscreenUnavailable'), 'error'); });
        } catch (e) { showToast(t('fullscreenUnavailable'), 'error'); }
      } else showToast(t('fullscreenUnsupported'), 'error');
    } else {
      const exit = doc.exitFullscreen || doc.webkitExitFullscreen || doc.msExitFullscreen;
      if (exit) {
        try {
          const p = exit.call(doc);
          if (p && typeof p.catch === 'function') p.catch(function () {});
        } catch (e) {}
      }
    }
  }

  let wakeLock = null;
  async function updateWakeLock() {
    const want = state.settings.keepAwake && state.timer.status === 'running';
    if (want) {
      if (!('wakeLock' in navigator)) return;
      if (wakeLock) return;
      try {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', function () { wakeLock = null; });
      } catch (e) { wakeLock = null; }
    } else if (wakeLock) {
      try { await wakeLock.release(); } catch (e) {}
      wakeLock = null;
    }
  }

  /* ============================================================
     13. SETTINGS BINDING
     ============================================================ */

  function bindSettingsUI() {
    const s = state.settings;
    $('#setFocus').value = s.focusMin;
    $('#setShort').value = s.shortMin;
    $('#setLong').value = s.longMin;
    $('#setEvery').value = s.longEvery;
    $('#setAutoStartFocus').checked = s.autoStartFocus;
    $('#setAutoStartBreaks').checked = s.autoStartBreaks;
    $('#setSoundEnabled').checked = s.soundEnabled;
    $('#setSoundPreset').value = s.soundPreset;
    $('#setVolume').value = Math.round(s.volume * 100);
    $('#setBrowserNotif').checked = s.browserNotifications;
    $('#setInAppNotif').checked = s.inAppNotifications;
    $('#setKeepAwake').checked = s.keepAwake;
    updateNotifNote();
    renderSoundButton();
  }

  function updateNotifNote() {
    const note = $('#notifNote');
    if (!note) return;
    if (!canNotify()) { note.textContent = t('notifUnsupported'); return; }
    const perm = notifyPermission();
    if (perm === 'granted') note.textContent = t('notifGranted');
    else if (perm === 'denied') note.textContent = t('notifDenied');
    else note.textContent = t('notifPrompt');
  }

  function onDurationsChanged() {
    const tm = state.timer;
    if (tm.status === 'idle' || tm.status === 'completed') {
      tm.plannedMs = durationFor(tm.mode);
      tm.remainingMs = tm.plannedMs;
    }
    saveNow();
    renderTimer();
  }

  function bindSettingEvents() {
    $('#setFocus').addEventListener('change', function (e) {
      const v = Math.round(clamp(parseInt(e.target.value, 10) || 25, 1, 180));
      e.target.value = v;
      state.settings.focusMin = v;
      onDurationsChanged();
    });
    $('#setShort').addEventListener('change', function (e) {
      const v = Math.round(clamp(parseInt(e.target.value, 10) || 5, 1, 60));
      e.target.value = v;
      state.settings.shortMin = v;
      onDurationsChanged();
    });
    $('#setLong').addEventListener('change', function (e) {
      const v = Math.round(clamp(parseInt(e.target.value, 10) || 15, 1, 120));
      e.target.value = v;
      state.settings.longMin = v;
      onDurationsChanged();
    });
    $('#setEvery').addEventListener('change', function (e) {
      const v = Math.round(clamp(parseInt(e.target.value, 10) || 4, 2, 12));
      e.target.value = v;
      state.settings.longEvery = v;
      saveNow();
      renderTimer();
    });
    $('#setAutoStartFocus').addEventListener('change', function (e) {
      state.settings.autoStartFocus = e.target.checked;
      saveNow();
    });
    $('#setAutoStartBreaks').addEventListener('change', function (e) {
      state.settings.autoStartBreaks = e.target.checked;
      saveNow();
    });
    $('#setSoundEnabled').addEventListener('change', function (e) {
      state.settings.soundEnabled = e.target.checked;
      if (e.target.checked) ensureAudio();
      saveNow();
      renderSoundButton();
    });
    $('#setSoundPreset').addEventListener('change', function (e) {
      state.settings.soundPreset = e.target.value;
      saveNow();
      playPreset(e.target.value);
    });
    $('#setVolume').addEventListener('input', function (e) {
      const v = clamp(parseInt(e.target.value, 10) / 100, 0, 1);
      state.settings.volume = v;
      applyVolume(v);
      save();
    });
    $('#btnPreviewSound').addEventListener('click', function () {
      ensureAudio();
      applyVolume(state.settings.volume);
      playPreset(state.settings.soundPreset);
    });
    $('#setBrowserNotif').addEventListener('change', function (e) {
      const wants = e.target.checked;
      if (!wants) {
        state.settings.browserNotifications = false;
        saveNow(); updateNotifNote();
        return;
      }
      if (!canNotify()) {
        e.target.checked = false;
        state.settings.browserNotifications = false;
        saveNow(); updateNotifNote();
        showToast(t('browserNotifUnsupported'), 'error');
        return;
      }
      requestNotifPermission().then(function (perm) {
        if (perm === 'granted') {
          state.settings.browserNotifications = true;
          showToast(t('browserNotifEnabled'), 'success');
        } else {
          state.settings.browserNotifications = false;
          e.target.checked = false;
          showToast(t('browserNotifNotGranted'), 'error');
        }
        saveNow(); updateNotifNote();
      });
    });
    $('#setInAppNotif').addEventListener('change', function (e) {
      state.settings.inAppNotifications = e.target.checked;
      saveNow();
    });
    $('#setKeepAwake').addEventListener('change', function (e) {
      state.settings.keepAwake = e.target.checked;
      saveNow();
      updateWakeLock();
      if (e.target.checked && !('wakeLock' in navigator)) {
        showToast(t('wakeLockUnsupported'), 'error');
      }
    });
    $('#btnExport').addEventListener('click', exportData);
    $('#btnImport').addEventListener('click', function () { $('#fileInput').click(); });
    $('#fileInput').addEventListener('change', function (e) {
      const file = e.target.files && e.target.files[0];
      if (file) importData(file);
      e.target.value = '';
    });
    $('#btnClearData').addEventListener('click', clearAllData);

    /* Accordion: only one open at a time */
    $$('.acc').forEach(function (acc) {
      acc.addEventListener('toggle', function () {
        if (acc.open) {
          $$('.acc').forEach(function (other) {
            if (other !== acc) other.open = false;
          });
        }
      });
    });
  }

  /* ============================================================
     14. DATA EXPORT / IMPORT / CLEAR
     ============================================================ */

  function exportData() {
    const payload = deepCopy(state);
    payload.app = 'pomodoro';
    payload.version = SCHEMA_VERSION;
    payload.exportedAt = new Date().toISOString();
    let blob;
    try { blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' }); }
    catch (e) { showToast(t('exportFailed'), 'error'); return; }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'pomodoro-backup-' + dateKey(Date.now()) + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
    showToast(t('exportSuccess'), 'success');
  }

  function importData(file) {
    const reader = new FileReader();
    reader.onload = function () {
      let parsed;
      try { parsed = JSON.parse(reader.result); }
      catch (e) { showToast(t('importInvalidJson'), 'error'); return; }
      if (!parsed || typeof parsed !== 'object' ||
          (typeof parsed.tasks === 'undefined' &&
           typeof parsed.sessions === 'undefined' &&
           typeof parsed.settings === 'undefined')) {
        showToast(t('importNotBackup'), 'error');
        return;
      }
      confirmDialog(t('importConfirmTitle'), t('importConfirmMessage'), t('importConfirmBtn')).then(function (ok) {
        if (!ok) return;
        const fresh = createDefaultState();
        state = sanitizeState(parsed, fresh);
        state.timer.status = 'idle';
        state.timer.endAt = null;
        stopTicking();
        saveNow();
        document.body.dataset.mode = state.timer.mode;
        bindSettingsUI();
        applyTranslations();
        renderAll();
        updateWakeLock();
        showToast(t('importSuccess'), 'success');
      });
    };
    reader.onerror = function () { showToast(t('importInvalidJson'), 'error'); };
    reader.readAsText(file);
  }

  function clearAllData() {
    confirmDialog(t('clearDataTitle'), t('clearDataMessage'), t('clearDataConfirm'), true).then(function (ok) {
      if (!ok) return;
      stopTicking();
      try { window.localStorage.removeItem(STORAGE_KEY); } catch (e) {}
      state = createDefaultState();
      document.body.dataset.mode = state.timer.mode;
      saveNow();
      bindSettingsUI();
      applyTranslations();
      renderAll();
      updateWakeLock();
      showToast(t('clearDataSuccess'), 'success');
    });
  }

  /* ============================================================
     15. NAVIGATION
     ============================================================ */

  function showView(name) {
    $$('.view').forEach(function (v) {
      v.classList.toggle('active', v.id === 'view-' + name);
    });
    $$('.tab').forEach(function (tab) {
      const on = tab.dataset.view === name;
      tab.classList.toggle('active', on);
      tab.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    if (name === 'stats') renderStats();
    if (name === 'tasks') renderTasks();
    if (name === 'timer') { renderTimer(); renderTaskPill(); }
    if (name === 'settings') bindSettingsUI();
  }

  /* ============================================================
     16. EVENT WIRING
     ============================================================ */

  function bindEvents() {
    $$('.tab').forEach(function (tab) {
      tab.addEventListener('click', function () { showView(tab.dataset.view); });
    });

    $('#btnTheme').addEventListener('click', function () {
      state.settings.theme = state.settings.theme === 'light' ? 'dark' : 'light';
      saveNow();
      applyTheme(state.settings.theme);
    });

    $('#btnLang').addEventListener('click', function () {
      state.settings.language = state.settings.language === 'vi' ? 'en' : 'vi';
      saveNow();
      closeModal();
      applyTranslations();
    });

    $('#btnSound').addEventListener('click', function () {
      state.settings.soundEnabled = !state.settings.soundEnabled;
      if (state.settings.soundEnabled) {
        ensureAudio();
        applyVolume(state.settings.volume);
        playPreset(state.settings.soundPreset);
      }
      saveNow();
      renderSoundButton();
      const cb = $('#setSoundEnabled');
      if (cb) cb.checked = state.settings.soundEnabled;
    });

    $('#btnFullscreen').addEventListener('click', toggleFullscreen);

    $('#btnStart').addEventListener('click', function () {
      ensureAudio();
      toggleTimer();
    });
    $('#btnReset').addEventListener('click', resetTimer);
    $('#btnSkip').addEventListener('click', skipSession);

    $$('.mode-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        const mode = btn.dataset.mode;
        if (mode === state.timer.mode && state.timer.status === 'idle') return;
        setMode(mode);
      });
    });

    $('#taskPillBtn').addEventListener('click', openTaskPicker);

    $('#btnAddTask').addEventListener('click', function () { openTaskEditor(null); });

    $('#taskList').addEventListener('click', function (e) {
      const row = e.target.closest('.task-row');
      if (!row) return;
      const id = row.dataset.id;
      const actionBtn = e.target.closest('[data-act]');
      if (actionBtn) {
        const act = actionBtn.dataset.act;
        if (act === 'toggle') { toggleTaskDone(id); return; }
        if (act === 'edit') { openTaskEditor(getTaskById(id)); return; }
        if (act === 'delete') { deleteTask(id); return; }
      }
      const task = getTaskById(id);
      if (task && !task.done) setActiveTask(id);
    });

    $('#modalOverlay').addEventListener('click', function (e) {
      if (e.target === $('#modalOverlay')) closeModal();
    });

    document.addEventListener('keydown', function (e) {
      const target = e.target;
      const tag = (target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea' || tag === 'select' || target.isContentEditable) {
        if (e.key === 'Escape') closeModal();
        return;
      }
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const overlay = $('#modalOverlay');
      const modalOpen = overlay && !overlay.hidden;
      if (e.key === 'Escape') { if (modalOpen) closeModal(); return; }
      if (modalOpen) return;
      switch (e.key.toLowerCase()) {
        case ' ':
        case 'spacebar':
          e.preventDefault(); ensureAudio(); toggleTimer(); break;
        case 'r': e.preventDefault(); resetTimer(); break;
        case 'n': e.preventDefault(); skipSession(); break;
        case 'f': e.preventDefault(); toggleFullscreen(); break;
        case 's': e.preventDefault(); showView('settings'); break;
      }
    });

    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible') {
        if (state.timer.status === 'running') tick();
        updateWakeLock();
      }
    });

    window.addEventListener('beforeunload', function () { saveNow(); });

    const unlock = function () {
      ensureAudio();
      applyVolume(state.settings.volume);
      document.removeEventListener('pointerdown', unlock);
      document.removeEventListener('keydown', unlock);
    };
    document.addEventListener('pointerdown', unlock, { once: false });
    document.addEventListener('keydown', unlock, { once: false });
  }

  /* ============================================================
     17. INIT
     ============================================================ */

  function init() {
    checkStorage();
    state = loadState();
    document.body.dataset.mode = state.timer.mode;
    document.documentElement.lang = state.settings.language;

    bindEvents();
    bindSettingEvents();
    bindSettingsUI();
    applyTranslations();
    renderAll();
    reconcileTimer();

    if (!storageOK) showToast(t('storageUnavailable'), 'error');
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>
</body>
</html>
